<style>
/* Layout: one continuous illustrated world (all scenes along a single road) filmed by a GSAP camera; kinetic phrases synced word by word to the voice sit in a text column. */
:root{--ink:#0F1426;--paper:#EEF0F6;--acc:#9FB0FF;--peri:#C7CEF0;--sans:"Instrument Sans","Helvetica Neue",Arial,sans-serif;color-scheme:dark}
[hidden]{display:none!important}
html,body{height:100%}
body{background:#05070D;color:var(--paper);font-family:var(--sans);margin:0;overflow:hidden}
.app{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding-inline:16px;box-sizing:border-box}
.wrap{flex:1;min-height:0;width:100%;display:grid;place-items:center}
.film{position:relative;overflow:hidden;background:var(--ink);container-type:size;--tone:0}
#panels{position:absolute;inset:0}#panels>div{position:absolute;inset:0;clip-path:inset(0 100% 0 0)}
.bug{color:color-mix(in srgb,var(--ink) calc(var(--tone)*100%),var(--paper))}
.wmk{background:color-mix(in srgb,var(--ink) calc(var(--tone)*100%),var(--paper))!important}
.tb.lt .kt{color:var(--ink)}
.tb.lt .kt .w.em>b,.tb.lt .kt .w.big>b{color:#3E4A88}
.tb.lt .kt .w.hl>b{color:var(--ink)!important}
.tb[data-sc="s5"] .kt .w.em>b,.tb[data-sc="s5"] .kt .w.big>b{color:#E3E8FF}
.tb[data-sc="s7b"]{--acc:#FFFFFF}
.tb[data-sc="s7b"] .kt .w.em:not(.hl)>b{color:#FFFFFF}
/* light scenes: re-ink the line work */
.st[data-st="s3"] #brkT{fill:#0F1426}
.st[data-st="s8"] .tile8>rect{fill:#FFFFFF}
.st[data-st="s8"] [stroke="#EEF0F6"]{stroke:#0F1426}
.st[data-st="s8"] [fill="#EEF0F6"]{fill:#0F1426}
.st[data-st="s8"] text[fill="#C7CEF0"]{fill:#5A6690}
.st[data-st="s9"] #hotel9 [fill="#C7CEF0"]{fill:#FFFFFF}
.st[data-st="s9"] #hotel9 [stroke="#EEF0F6"]{stroke:#5A6690}
.st[data-st="s9"] #hotel9 [fill="rgba(238,240,246,.18)"]{fill:rgba(15,20,38,.14)}
#world{position:absolute;inset:0;width:100%;height:100%}
svg text{font-family:var(--sans)}
.dim{position:absolute;inset:0;background:var(--ink);opacity:0;pointer-events:none}
.wmk{position:absolute;width:110cqmin;height:110cqmin;left:-38cqmin;bottom:-44cqmin;background:var(--paper);opacity:.035;-webkit-mask:var(--emask) center/contain no-repeat;mask:var(--emask) center/contain no-repeat;pointer-events:none}
.grain{position:absolute;inset:0;pointer-events:none;opacity:.05;background-image:radial-gradient(rgba(255,255,255,.5) 1px,transparent 1px);background-size:4px 4px}

/* text */
.tb{position:absolute;left:6cqw;width:40cqw;top:0;bottom:0;display:flex;align-items:center;pointer-events:none}
.tb.center{left:8cqw;right:8cqw;width:auto;justify-content:center;text-align:center}
.tb.low{top:auto;bottom:11cqh;height:20cqh}
.tb.mid{top:52cqh;bottom:auto;height:20cqh}
.portrait .tb{left:6cqw;right:6cqw;width:auto;top:9cqh;bottom:auto;height:30cqh;align-items:flex-end}
.portrait .tb.low{top:auto;bottom:12cqh}
.portrait .tb.mid{top:46cqh}
.kt{font-weight:600;font-size:12cqmin;line-height:1.04;letter-spacing:-.035em;margin:0;display:grid;width:100%}
.portrait .kt{font-size:13.2cqmin}
.kt.s{font-size:8.8cqmin}
.kt .ch{grid-area:1/1;align-self:center;transform-origin:0 50%;text-wrap:balance}
.center .kt .ch{transform-origin:50% 50%}
.kt .w{display:inline-block;overflow:hidden;vertical-align:top;padding:0 .03em .12em;margin-bottom:-.12em}
.kt .w.big{font-size:1.75em;line-height:.95;overflow:visible;vertical-align:baseline}
.kt .w.big>b{color:var(--acc);font-style:italic;font-weight:600;transform-origin:30% 70%}
.kt .ch.popc .w{overflow:visible}
.kt .w>b{display:inline-block;font-weight:inherit;opacity:0;transform-origin:0 100%;will-change:transform}
.kt .w.em>b{color:var(--acc);font-style:italic;font-weight:500}
.kt .w.hl>b{background:linear-gradient(var(--acc),var(--acc)) no-repeat left 100%/calc(var(--h,0) * 100%) 100%;padding:0 .1em;margin:0 -.04em;color:color-mix(in srgb,var(--ink) calc(var(--h,0) * 100%),var(--paper))}

/* overlays */
.ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3.4cqmin;pointer-events:none}
.emb{position:relative;width:30cqmin;height:30cqmin}
.emb i{position:absolute;inset:-6%;background:var(--paper);-webkit-mask:var(--emask) center/contain no-repeat;mask:var(--emask) center/contain no-repeat;clip-path:circle(calc(var(--a,0) * 72%) at 50% 50%)}
#ctaOv::before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse 40% 30% at 50% 24%,rgba(15,20,38,.9),rgba(15,20,38,.45) 60%,rgba(15,20,38,0) 100%)}
#ctaOv>.streak{position:relative}
#logoOv::before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse 46% 42% at 50% 44%,rgba(15,20,38,.92),rgba(15,20,38,.55) 55%,rgba(15,20,38,0) 100%),radial-gradient(circle at 50% 36%,rgba(159,176,255,.16),rgba(159,176,255,0) 28%)}
.rays{position:absolute;inset:-120%;border-radius:50%;background:repeating-conic-gradient(rgba(199,206,240,.16) 0 4deg,rgba(199,206,240,0) 4deg 18deg);-webkit-mask:radial-gradient(circle,#000 18%,transparent 62%);mask:radial-gradient(circle,#000 18%,transparent 62%);opacity:0}
.orb{position:absolute;inset:-14%;border-radius:50%;border:1.5px solid rgba(199,206,240,.25);opacity:0}.orb b{position:absolute;left:50%;top:-1.2cqmin;width:2.4cqmin;height:2.4cqmin;margin-left:-1.2cqmin;border-radius:50%;background:#fff;box-shadow:0 0 3cqmin 1cqmin rgba(199,206,240,.9)}
.glintE{position:absolute;inset:-6%;background:linear-gradient(115deg,transparent 30%,rgba(255,243,220,.55) 42%,#FFFFFF 50%,rgba(255,243,220,.55) 58%,transparent 70%) no-repeat;background-size:220% 100%;background-position:var(--gx,140%) 0;-webkit-mask:var(--emask) center/contain no-repeat;mask:var(--emask) center/contain no-repeat;opacity:1}
#emb2 i,#wm2{background:#BFC6E0!important}
.glint{position:absolute;inset:0;background:linear-gradient(110deg,transparent 36%,rgba(255,243,220,.55) 45%,#FFFFFF 50%,rgba(255,243,220,.55) 55%,transparent 64%) no-repeat;background-size:250% 100%;background-position:var(--gx,140%) 0;-webkit-mask:var(--wmask) center/contain no-repeat;mask:var(--wmask) center/contain no-repeat}
.streak{width:min(70cqw,80cqmin);height:.35cqmin;margin-top:-1cqmin;background:linear-gradient(90deg,transparent,#fff 50%,transparent);box-shadow:0 0 2cqmin rgba(199,206,240,.8);transform:scaleX(0);opacity:0}
.hr{position:absolute;inset:-30%;border-radius:50%;border:2px solid var(--acc);opacity:0}
.wm{position:relative;width:min(70cqw,84cqmin);aspect-ratio:1400/270;background:var(--paper);-webkit-mask:var(--wmask) center/contain no-repeat;mask:var(--wmask) center/contain no-repeat}
#ctaOv{justify-content:flex-start;padding-top:12cqh;box-sizing:border-box}
.ctaRow{position:absolute;left:0;right:0;top:74cqh;display:flex;flex-direction:column;align-items:center;gap:2cqmin}
.portrait .ctaRow{top:84cqh}
.cta{pointer-events:auto;position:relative;overflow:hidden;display:inline-flex;align-items:center;gap:1.6cqmin;background:var(--acc);color:var(--ink);text-decoration:none;font-weight:600;font-size:3.4cqmin;padding:2.4cqmin 4.8cqmin;border-radius:999px}
.cta::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.75) 50%,transparent 70%);transform:translateX(calc(var(--sh,-1) * 120%))}
.cta:focus-visible{outline:3px solid var(--paper);outline-offset:5px}
.cursor{position:absolute;width:5cqmin;height:5cqmin;left:0;top:0;pointer-events:none}
.ripple{position:absolute;width:6cqmin;height:6cqmin;border-radius:50%;border:.4cqmin solid var(--paper);left:0;top:0;opacity:0;pointer-events:none}
.url{font-size:2cqmin;letter-spacing:.06em;opacity:.7;user-select:all}
.bug{position:absolute;z-index:40;top:4cqmin;left:4.4cqmin;display:flex;align-items:center;gap:1.2cqmin;font-weight:600;font-size:1.7cqmin;letter-spacing:.2em;text-transform:uppercase;opacity:0}
.bug i{width:3.8cqmin;height:3.8cqmin;background:currentColor;-webkit-mask:var(--emask) center/contain no-repeat;mask:var(--emask) center/contain no-repeat}
.prog{position:absolute;z-index:40;left:0;bottom:0;height:.5cqmin;background:var(--acc);width:0}
.start{position:absolute;inset:0;z-index:50;display:grid;place-items:center;background:rgba(15,20,38,.55)}
.play{display:inline-flex;align-items:center;gap:1.6cqmin;cursor:pointer;background:var(--acc);color:var(--ink);border:none;border-radius:999px;font-family:var(--sans);font-weight:600;font-size:2.8cqmin;padding:2.4cqmin 4.6cqmin}
.play svg{width:2.2cqmin;height:2.2cqmin;fill:currentColor}
.play:focus-visible{outline:3px solid var(--paper);outline-offset:5px}
.controls{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;align-items:center;padding-block:0 12px}
.controls button{font-family:var(--sans);font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;background:transparent;color:#AEB5CF;border:1px solid #2A3352;padding:8px 14px;cursor:pointer;border-radius:999px}
.controls button[aria-pressed="true"]{color:var(--ink);background:var(--paper);border-color:var(--paper)}
.controls button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.time{font-size:12px;color:#AEB5CF;min-width:92px;text-align:center;font-variant-numeric:tabular-nums}
.scrub{width:min(560px,80vw);accent-color:var(--acc)}
.render .controls,.render .start{display:none!important}
.render .app{padding:0}
</style>

  tl.fromTo('#ctaOv',{opacity:0},{opacity:1,duration:.5,ease:'sine.inOut'},ct-.25);
  tl.fromTo('#emb2',{'--a':0,rotation:90,scale:.85},{'--a':1,rotation:0,scale:1,duration:1.2,ease:'expo.out'},ct);
  tl.to('#emb2',{rotation:20,duration:7,ease:'none'},ct+1.2);
  tl.fromTo('#wm2',{clipPath:'inset(0 50% 0 50%)'},{clipPath:'inset(0 0% 0 0%)',duration:.9,ease:'expo.out'},ct+.3);
  tl.fromTo('#glintE',{'--gx':'140%'},{'--gx':'-40%',duration:.7,ease:'power2.inOut'},ct+1.25);
  tl.fromTo('#glint2',{'--gx':'140%'},{'--gx':'-40%',duration:.8,ease:'power2.inOut'},ct+1.4);
  tl.to('#bug',{opacity:0,duration:.3},ct-.2);
  tl.fromTo('#cta',{scale:0},{scale:1,duration:.5,ease:'back.out(2)'},C('book#2')-.25);
  tl.fromTo('#cta',{'--sh':-1},{'--sh':1,duration:.8,repeat:2,repeatDelay:.5,ease:'power2.inOut'},C('book#2')+.4);
  const cw=()=>$('#cta').offsetWidth,chh=()=>$('#cta').offsetHeight;
  tl.fromTo('#cursor',{x:()=>cw()*1.4,y:()=>chh()*2.4,opacity:0},{x:()=>cw()*.62,y:()=>chh()*.45,opacity:1,duration:.9,ease:'power2.inOut'},C('book#2')+.2);
  tl.to('#cta',{scale:.93,duration:.08,yoyo:true,repeat:1},C('book#2')+1.15);
  tl.fromTo('#rip',{x:()=>cw()*.62-W*.03,y:()=>chh()*.45-W*.03,scale:.3,opacity:.9},{scale:3,opacity:0,duration:.6},C('book#2')+1.15);
  tl.from('#url12',{opacity:0,y:20,duration:.5},C('today'));
  TL=tl;
}

// ---------- sound design ----------
const SFX=[];const add=(k,t,v)=>SFX.push({k,t,v});
VIS.forEach((c,i)=>{const first=i===0||VIS[i-1].sc!==c.sc;if(!first)add('swish',c.t-.08,.22);c.words.forEach(w=>{if(w.hl)add('tick',w.t+.1,.3)})});
['s3','s6','s7a','s7b','s8','s9','s10','s11'].forEach(k=>add('car',SA(k)-.05,.32));add('riser',SA('s2')-.9,.3);add('swish',SA('s2')-.1,.4);add('car',SA('s5')-.25,.32);
add('jet',C('lands')-.2,.4);add('jet',C('london#1')-.3,.3);add('jet',C('private')-.2,.12);add('jet',C('commercial')-.2,.1);add('jet',SA('s7b'),.3);add('jet',C('middle'),.25);
add('logo',C('city#1')-.3,.32);add('logo',C('city#2')-.3,.32);add('riser',C('operator')-1.2,.38);add('riser',C('handles')-1.3,.3);
['eight','dinner','table','venue','team','directly','biggin','charles','heathrow','bourget#2','maisons','embassies','palace','enough'].forEach(w=>add('tick',C(w),.26));
add('phone',C('change')-.2,.1);add('swish',C('lands')+.2,.34);add('swish',C('hand')+.1,.3);add('swish',C('broker#1')-.2,.34);add('tick',C('hope')+.05,.34);add('tick',C('all')+.05,.34);add('tick',C('works')-.02,.36);add('swish',C('she')-.05,.25);add('tick',C('europe'),.28);add('tick',C('middle'),.28);add('keycard',C('hotel'),.35);add('tick',C('fees')+.3,.3);add('tick',C('book#2')+1.15,.4);
SFX.sort((a,b)=>a.t-b.t);window.__mix={voOff:VO_OFF,end:T_END,sfx:SFX};

// ---------- per-frame ----------
function fmt(s){s=Math.max(0,s);return Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0')}
function jet1(t){const app=$('#jetApp'),orb=$('#orbit'),j=$('#jet1');const LA=app.getTotalLength(),LO=orb.getTotalLength(),L=LA+LO;
  if(t<J1.a0){j.style.opacity=0;$('#trail1').style.opacity=0;$('#ring').setAttribute('stroke-dashoffset',1885);$('#ringGlow').setAttribute('stroke-dashoffset',1885);return}
  // one continuous flight: approach flows straight into the lap at constant speed, easing only at the very end
  const u=cl((t-J1.a0)/(J1.o1-J1.a0));const k=gsap.parseEase('power1.out')(u)*L;
  const pt=x=>x<=LA?app.getPointAtLength(x):orb.getPointAtLength(Math.min(LO,x-LA));
  const p=pt(Math.min(k,L-3)),q=pt(Math.min(k+3,L));const e=cl((k-LA)/LO);
  const m=gsap.parseEase('sine.inOut')(cl((e-.72)/.28));const sc=(1.35-.45*cl(k/LA))*(1-.85*m);
  const ang=Math.atan2(q.y-p.y,q.x-p.x)*180/Math.PI;j.setAttribute('transform',`translate(${p.x} ${p.y}) rotate(${ang}) scale(${sc})`);j.style.opacity=1-m;
  const off=1885*(1-e);$('#ring').setAttribute('stroke-dashoffset',off);$('#ringGlow').setAttribute('stroke-dashoffset',off);
  const tr=$('#trail1');if(e>0&&e<1){const kk=e*LO,b=Math.max(0,kk-300);let d='';for(let x=b;x<=kk;x+=10){const P=orb.getPointAtLength(x);const rr=(kk-x)/300*26;const f=1+rr/300;d+=(d?'L':'M')+(500+(P.x-500)*f).toFixed(1)+' '+(470+(P.y-470)*f).toFixed(1)}tr.setAttribute('d',d);tr.style.opacity=(.5*(1-m)).toFixed(2)}else tr.style.opacity=0}
function relay(t){}
function dialFx(t){if(t>SA('s2')+1)return;const r=((gsap.getProperty('#hand','rotation')%360)+360)%360;$$('#ticks .tk').forEach((el,i)=>{const M=i%5===0;let d=(r-i*6+360)%360;const g=d<60?1-d/60:0;el.setAttribute('fill',g>.02?'#9FB0FF':'#EEF0F6');el.setAttribute('opacity',(M?.85:.35)+g*.6)});$('#fine1').setAttribute('transform',`rotate(${(-t*24).toFixed(2)} 500 470)`)}
function toneAt(t){let v=0;for(const p of PAN){if(t<p.t)break;v=v+(p.light-v)*cl((t-p.t)/.95)}return v}
const mixc=(a,b,f)=>`rgba(${Math.round(a[0]+(b[0]-a[0])*f)},${Math.round(a[1]+(b[1]-a[1])*f)},${Math.round(a[2]+(b[2]-a[2])*f)},${(a[3]+(b[3]-a[3])*f).toFixed(3)})`;
function render(t){
  if(TL)TL.seek(t,true);{const v=toneAt(t);$('#film').style.setProperty('--tone',v.toFixed(3));$('#road').setAttribute('stroke',mixc([238,240,246,.07],[15,20,38,.07],v));$('#roadC').setAttribute('stroke',mixc([238,240,246,.28],[15,20,38,.22],v));$('#para').style.opacity=((1-v*.6)*cl(1-(t-SA('s12')+.5)/.6)).toFixed(2)}jet1(t);relay(t);dialFx(t);
  applyCam();
  {const sec=Math.max(0,2400-Math.max(0,t-C('minutes'))*30);$('#clock').textContent=String(Math.floor(sec/60)).padStart(2,'0')+':'+String(Math.floor(sec%60)).padStart(2,'0')}
  {const f=1-gsap.parseEase('power2.out')(cl((t-C('fees')+.2)/.7));$('#fee9').textContent='€'+Math.round(150*f);$('#fee9').setAttribute('fill',f<.01?'#3E4FB8':'#0F1426')}
  $('#text').querySelectorAll('.tb').forEach(tb=>{const s=SCN.find(x=>x.id===tb.dataset.sc);tb.hidden=!(t>=s.a-.1&&t<s.b+.75)});
  STS.forEach(o=>{let v;if(t>=SA('s12')-.3)v=o.sc.includes('s11')?1-cl((t-SA('s12')-.2)/1.0):0;else{const a=Math.min(...o.sc.map(SA)),b=Math.max(...o.sc.map(id=>SCN.find(x=>x.id===id).b));v=t<a-.9?cl(1-(a-.9-t)/.5):t>b+.7?cl(1-(t-b-.7)/.5):1;v=Math.max(v,0)}o.el.style.opacity=v.toFixed(3)});
  $('#prog').style.width=(cl(t/T_END)*100).toFixed(2)+'%';
}

function layout(){const r=$('#wrap').getBoundingClientRect();const ar=portrait?9/16:16/9;let w=r.width,h=w/ar;if(h>r.height){h=r.height;w=h*ar}W=Math.floor(w);H=Math.floor(h);const f=$('#film');f.style.width=W+'px';f.style.height=H+'px';f.classList.toggle('portrait',portrait);
  $('#world').setAttribute('viewBox',`0 0 ${W} ${H}`);$$('.tb').forEach(t=>t.hidden=false);build();render(T)}

// ---------- playback ----------
const mk=s=>s&&s.startsWith('data:')?new Audio(s):null;
const vo=mk(ASSET.vo),mu=mk(ASSET.music);const POOL={};['logo','swish','tick','car','jet','phone','keycard','riser'].forEach(k=>{if(ASSET[k].startsWith('data:'))POOL[k]=[0,1,2,3].map(()=>new Audio(ASSET[k]))});let pi=0;
let DUCK=.55,T=C('city#1')+1.2,playing=false,started=false,t0=0,base=0,snd=true,prev=0;
function syncA(on){if(vo){const v=T-VO_OFF;if(on&&snd&&v>=0&&v<(vo.duration||99)){vo.currentTime=v;vo.play().catch(()=>{})}else vo.pause()}
  if(mu){if(on&&snd){mu.currentTime=Math.min(T,(mu.duration||75)-.1);mu.play().catch(()=>{})}else mu.pause()}}
function play(){playing=true;t0=performance.now();base=T;syncA(true);$('#pp').textContent='Pause';requestAnimationFrame(loop)}
function pause(){playing=false;syncA(false);$('#pp').textContent='Play'}
function loop(){if(!playing)return;let t=base+(performance.now()-t0)/1000;
  if(vo&&!vo.paused&&!vo.ended){const vt=vo.currentTime+VO_OFF;if(Math.abs(vt-t)>.05){base=vt;t0=performance.now();t=vt}}
  if(vo&&snd&&vo.paused&&!vo.ended&&prev<VO_OFF&&t>=VO_OFF){vo.currentTime=t-VO_OFF;vo.play().catch(()=>{})}
  if(mu){const sp=WORDS.some(w=>t>=w.a-.05&&t<w.b+.25);DUCK+=((sp?.36:.6)-DUCK)*.12;mu.volume=Math.max(0,DUCK*Math.min(1,(T_END-t)/2.5))}
  if(snd)for(const s of SFX)if(prev<s.t&&t>=s.t&&POOL[s.k]){const a=POOL[s.k][pi++%4];a.volume=Math.min(1,s.v);a.currentTime=0;a.play().catch(()=>{})}
  if(t>=T_END){t=T_END;pause()}
  prev=t;T=t;render(t);$('#time').textContent=fmt(t)+' / '+fmt(T_END);$('#scrub').value=Math.round(t/T_END*1000);requestAnimationFrame(loop)}
function seek(t){T=t;prev=t;base=t;t0=performance.now();if(playing)syncA(true);render(t);$('#time').textContent=fmt(t)+' / '+fmt(T_END)}
$('#go').onclick=()=>{started=true;$('#start').hidden=true;seek(0);play()};
$('#pp').onclick=()=>{if(!started)return $('#go').click();playing?pause():(T>=T_END&&seek(0),play())};
$('#scrub').oninput=e=>{if(!started){started=true;$('#start').hidden=true}seek(e.target.value/1000*T_END)};
$('#snd').onclick=e=>{snd=!snd;e.currentTarget.setAttribute('aria-pressed',snd);if(playing)syncA(snd)};
$('#f1').onclick=()=>{portrait=false;$('#f1').setAttribute('aria-pressed',true);$('#f2').setAttribute('aria-pressed',false);layout()};
$('#f2').onclick=()=>{portrait=true;$('#f2').setAttribute('aria-pressed',true);$('#f1').setAttribute('aria-pressed',false);layout()};
document.addEventListener('keydown',e=>{if(e.code==='Space'&&e.target===document.body){e.preventDefault();$('#pp').click()}});
if(location.hash.startsWith('#render')){document.body.classList.add('render');portrait=location.hash==='#render-portrait';$('#start').hidden=true;window.renderAt=t=>{T=t;render(t)}}
window.addEventListener('resize',layout);(document.fonts?document.fonts.ready:Promise.resolve()).then(layout);layout();
$('#time').textContent=fmt(0)+' / '+fmt(T_END);
</script>
